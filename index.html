<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Narozeninová minihra – Admin formulář</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,600;1,9..144,300&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --cream:#faf6f0; --warm-white:#fff9f2; --ink:#1a1208; --ink-soft:#4a3f2f;
  --gold:#c9983a; --gold-light:#f0d080; --gold-pale:#fdf3d8;
  --rose:#e8736a; --rose-pale:#fdf0ee; --border:#e8dfc8;
  --shadow:rgba(26,18,8,0.08); --radius:16px;
}
html,body{min-height:100vh;background:var(--cream);font-family:'DM Sans',sans-serif;color:var(--ink);}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 60% 40% at 10% 10%,rgba(201,152,58,.10) 0%,transparent 60%),radial-gradient(ellipse 50% 50% at 90% 90%,rgba(232,115,106,.08) 0%,transparent 60%);pointer-events:none;z-index:0;}
.page-wrapper{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:48px 24px 80px;}
header{text-align:center;margin-bottom:48px;}
.header-badge{display:inline-flex;align-items:center;gap:8px;background:var(--gold-pale);border:1px solid var(--gold-light);border-radius:100px;padding:6px 18px;font-size:12px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);margin-bottom:18px;}
h1{font-family:'Fraunces',serif;font-size:clamp(30px,6vw,48px);font-weight:300;line-height:1.1;letter-spacing:-.02em;}
h1 em{font-style:italic;color:var(--gold);}
.subtitle{margin-top:10px;color:var(--ink-soft);font-size:15px;font-weight:300;}
.card{background:var(--warm-white);border:1px solid var(--border);border-radius:24px;padding:36px;box-shadow:0 4px 24px var(--shadow);}
.card-title{font-family:'Fraunces',serif;font-size:18px;font-weight:600;margin-bottom:28px;color:var(--ink);display:flex;align-items:center;gap:10px;}
.card-title .dot{width:8px;height:8px;border-radius:50%;background:var(--gold);flex-shrink:0;}
.field{margin-bottom:22px;}
label{display:block;font-size:12px;font-weight:500;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:8px;}
input[type="text"],textarea,select{width:100%;background:var(--cream);border:1.5px solid var(--border);border-radius:var(--radius);padding:14px 18px;font-family:'DM Sans',sans-serif;font-size:15px;color:var(--ink);outline:none;transition:border-color .2s,box-shadow .2s,background .2s;appearance:none;}
input[type="text"]:focus,textarea:focus,select:focus{border-color:var(--gold);background:#fff;box-shadow:0 0 0 4px rgba(201,152,58,.10);}
textarea{resize:vertical;min-height:100px;line-height:1.6;}
.char-count{text-align:right;font-size:12px;color:var(--ink-soft);margin-top:6px;transition:color .2s;}
.char-count.warn{color:var(--rose);}
.select-wrapper{position:relative;}
.select-wrapper::after{content:'↓';position:absolute;right:16px;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--ink-soft);font-size:14px;}
.upload-zone{border:2px dashed var(--border);border-radius:var(--radius);padding:32px 20px;text-align:center;cursor:pointer;transition:all .2s;background:var(--cream);position:relative;}
.upload-zone:hover,.upload-zone.drag-over{border-color:var(--gold);background:var(--gold-pale);}
.upload-zone input[type="file"]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;}
.upload-icon{font-size:28px;margin-bottom:8px;display:block;}
.upload-text{font-size:14px;color:var(--ink-soft);font-weight:300;}
.upload-text strong{color:var(--gold);font-weight:500;}
.field-error{margin-top:8px;font-size:12.5px;color:var(--rose);display:none;align-items:center;gap:5px;}
.field-error.visible{display:flex;}
.submit-btn{width:100%;padding:16px 24px;background:var(--ink);color:var(--cream);border:none;border-radius:var(--radius);font-family:'DM Sans',sans-serif;font-size:15px;font-weight:500;letter-spacing:.03em;cursor:pointer;transition:all .2s;margin-top:8px;}
.submit-btn:hover{background:#2d1f0e;transform:translateY(-1px);box-shadow:0 8px 24px rgba(26,18,8,.18);}
.submit-btn:active{transform:translateY(0);}
.submit-btn:disabled{opacity:.5;cursor:not-allowed;transform:none;}
.submit-btn .btn-inner{display:flex;align-items:center;justify-content:center;gap:10px;}
.status-msg{margin-top:14px;padding:14px 18px;border-radius:var(--radius);font-size:14px;display:none;}
.status-msg.success{background:#ecfdf5;border:1px solid #6ee7b7;color:#065f46;display:block;}
.status-msg.error{background:var(--rose-pale);border:1px solid #fca5a5;color:#991b1b;display:block;}
.spinner{width:16px;height:16px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite;display:none;}
@keyframes spin{to{transform:rotate(360deg);}}
@keyframes fadeUp{from{opacity:0;transform:translateY(18px);}to{opacity:1;transform:translateY(0);}}
header{animation:fadeUp .5s ease both;}
.card{animation:fadeUp .5s ease .08s both;}
</style>
</head>
<body>
<div class="page-wrapper">
  <header>
    <div class="header-badge">🎂 Admin panel</div>
    <h1>Narozeninová <em>minihra</em></h1>
    <p class="subtitle">Vyplňte formulář a uložte data do Firebase</p>
  </header>

  <div class="card">
    <div class="card-title"><span class="dot"></span> Údaje narozenin</div>
    <form id="birthdayForm" novalidate>

      <div class="field">
        <label for="nameInput">Jméno oslavence</label>
        <input type="text" id="nameInput" placeholder="např. Markéta" autocomplete="off" />
        <div class="field-error" id="nameError">⚠ Zadejte jméno oslavence</div>
      </div>

      <div class="field">
        <label for="headlineSelect">Hlavní text přání</label>
        <div class="select-wrapper">
          <select id="headlineSelect">
            <option value="">— Vyberte text —</option>
            <option value="Veselé narozeniny">Veselé narozeniny</option>
            <option value="Všechno nejlepší">Všechno nejlepší</option>
          </select>
        </div>
        <div class="field-error" id="headlineError">⚠ Vyberte hlavní text</div>
      </div>

      <div class="field">
        <label for="wishInput">Text přání</label>
        <textarea id="wishInput" placeholder="Napiš krátké přání…" maxlength="200"></textarea>
        <div class="char-count" id="charCount">0 / 200</div>
        <div class="field-error" id="wishError">⚠ Zadejte text přání</div>
      </div>

      <div class="field">
        <label>Fotka oslavence <span style="color:var(--ink-soft);font-size:11px;text-transform:none;font-weight:300;">(na šířku, landscape)</span></label>
        <div class="upload-zone" id="uploadZone">
          <input type="file" id="photoInput" accept="image/*" />
          <span class="upload-icon">📸</span>
          <div class="upload-text"><strong>Klikněte</strong> nebo přetáhněte soubor</div>
          <div class="upload-text" style="font-size:12px;margin-top:4px;">JPG, PNG, WEBP – min. šířka 800px</div>
        </div>
        <div class="field-error" id="photoError">⚠ Nahrajte fotografii na šířku</div>
      </div>

      <button type="submit" class="submit-btn" id="submitBtn">
        <span class="btn-inner">
          <span class="spinner" id="spinner"></span>
          <span id="btnText">Uložit do Firebase 🎉</span>
        </span>
      </button>
      <div class="status-msg" id="statusMsg"></div>
    </form>
  </div>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import { getFirestore, collection, addDoc, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
import { getStorage, ref, uploadBytes, getDownloadURL } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js';

// ── Sem vložte vaše Firebase hodnoty ──────────────────────────
const firebaseConfig = {
  apiKey: "AIzaSyCA25qJJBLRODFje9WCqpaThn_aoNVupHE",
  authDomain: "birthdaygame-b0124.firebaseapp.com",
  projectId: "birthdaygame-b0124",
  storageBucket: "birthdaygame-b0124.firebasestorage.app",
  messagingSenderId: "345793699157",
  appId: "1:345793699157:web:b8ca81db0619ea2d67e3dc"
};
// ──────────────────────────────────────────────────────────────

const app     = initializeApp(firebaseConfig);
const db      = getFirestore(app);
const storage = getStorage(app);

// Char counter
const wishInput = document.getElementById('wishInput');
const charCount = document.getElementById('charCount');
wishInput.addEventListener('input', () => {
  const l = wishInput.value.length;
  charCount.textContent = `${l} / 200`;
  charCount.classList.toggle('warn', l > 170);
});

// Photo upload
let photoFile = null;
const photoInput = document.getElementById('photoInput');
const uploadZone = document.getElementById('uploadZone');

photoInput.addEventListener('change', e => handlePhoto(e.target.files[0]));
uploadZone.addEventListener('dragover', e => { e.preventDefault(); uploadZone.classList.add('drag-over'); });
uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('drag-over'));
uploadZone.addEventListener('drop', e => {
  e.preventDefault(); uploadZone.classList.remove('drag-over');
  const f = e.dataTransfer.files[0];
  if (f?.type.startsWith('image/')) { photoInput.files = e.dataTransfer.files; handlePhoto(f); }
});

function handlePhoto(file) {
  if (!file) return;
  const err = document.getElementById('photoError');
  const reader = new FileReader();
  reader.onload = ev => {
    const img = new Image();
    img.onload = () => {
      if (img.width < img.height) {
        err.textContent = '⚠ Fotka musí být na šířku (landscape)';
        err.classList.add('visible');
        photoFile = null;
        return;
      }
      err.classList.remove('visible');
      photoFile = file;
      uploadZone.querySelector('.upload-text').innerHTML = `<strong>${file.name}</strong>`;
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}

// Submit
const nameInput      = document.getElementById('nameInput');
const headlineSelect = document.getElementById('headlineSelect');

document.getElementById('birthdayForm').addEventListener('submit', async e => {
  e.preventDefault();
  if (!validate()) return;
  setLoading(true);
  try {
    const ext  = photoFile.name.split('.').pop();
    const sRef = ref(storage, `birthday/${Date.now()}.${ext}`);
    await uploadBytes(sRef, photoFile);
    const photoURL = await getDownloadURL(sRef);
    const docRef = await addDoc(collection(db, 'birthday_games'), {
      name:      nameInput.value.trim(),
      headline:  headlineSelect.value,
      wish:      wishInput.value.trim(),
      photoURL,
      createdAt: serverTimestamp(),
    });
    showStatus(`✅ Uloženo! ID: ${docRef.id}`, 'success');
    resetForm();
  } catch(err) {
    showStatus(`❌ Chyba: ${err.message}`, 'error');
  } finally { setLoading(false); }
});

function validate() {
  let ok = true;
  [['nameInput','nameError'],['wishInput','wishError']].forEach(([inp,err]) => {
    const e = document.getElementById(err);
    if (!document.getElementById(inp).value.trim()) { e.classList.add('visible'); ok=false; }
    else e.classList.remove('visible');
  });
  const he = document.getElementById('headlineError');
  if (!headlineSelect.value) { he.classList.add('visible'); ok=false; } else he.classList.remove('visible');
  const pe = document.getElementById('photoError');
  if (!photoFile) { pe.textContent='⚠ Nahrajte fotografii na šířku'; pe.classList.add('visible'); ok=false; }
  return ok;
}

function setLoading(on) {
  document.getElementById('submitBtn').disabled = on;
  document.getElementById('spinner').style.display = on ? 'block' : 'none';
  document.getElementById('btnText').textContent = on ? 'Ukládám…' : 'Uložit do Firebase 🎉';
}

function showStatus(msg, type) {
  const el = document.getElementById('statusMsg');
  el.textContent = msg; el.className = `status-msg ${type}`;
}

function resetForm() {
  nameInput.value=''; headlineSelect.value=''; wishInput.value=''; photoInput.value=''; photoFile=null;
  charCount.textContent='0 / 200';
  uploadZone.querySelector('.upload-text').innerHTML = '<strong>Klikněte</strong> nebo přetáhněte soubor';
}
</script>
</body>
</html>
